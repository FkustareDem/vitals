; ===========================================================================
;  vitals.ini  --  透明生命体征条 (左下角跑马灯)
;  改完保存 -> 右键面板/托盘图标 -> "重新加载配置"  立即生效
;  注释符 ';'  (颜色写 #RRGGBB 所以 '#' 不是注释符), 文件存 UTF-8
; ===========================================================================

; ------------------------------------------------ 外观 ---------------------
font         = DengXian        ; 一个字体通吃 -> 中英风格/粗细/高度统一 (中英宽度比 2:1)
font_cjk     =                 ; 留空 = 与主字体相同; 只有主字体不含汉字时才需要填
weight       = 400             ; 字重 400=常规 600=半粗 700=粗
size         = 12              ; 字号
letter_space = 3               ; 段间距
opacity      = 235             ; 整体透明度 0..255
color        = #00E5FF         ; 默认文字颜色
bg           = #000000         
bg_alpha     = 0               ; 0 = 全透明
bg_style     = none          ; 背景: none / grad(黑灰渐变) / frost(毛玻璃) / glass(通透玻璃)
bg_radius    = 40            ; 圆角半径(px). 给大值会被钳到 高的一半, 就是四分之一个圆的胶囊端
glitch       = 0               ; 1 = 红青重影
topmost      = 1               ; 永远置顶
grab_full    = 1               ; 整条可拖动
align        = 1               ; 1 = 每个槽固定像素格子(整行宽度恒定)
bolden       = 1               ; 加粗档位 0..2
smooth       = 1               ; 1 = 亚像素平滑滚动(关掉会有整数像素的顿挫感)
snap         = 1               ; 1 = 每帧整数像素步进(最匀最脆, 推荐); 0 = 按真实时间走但要亚像素插值
arrow        = 1               ; 1 = 超出正常区间显示 ↑ / ↓

; ------------------------------------------------ 波形 ---------------------
wave         = 1               ; 1 = 显示实时波形小图 (右键菜单也能开关)
wave_h       = 26              ; 波形带高度(像素)
wave_bold    = 1               ; 波形描边: 上下各往外扩几像素(0=最细, 1~4 越来越粗)
wave_type    = ecg             ; ecg 心电 / ppg 脉搏波 / resp 呼吸波
wave_color   = #39FF14         ; 波形颜色
pull         = 2               ; 回归强度: 越大越贴着正常值(箭头越少), 1=25% 2=11% 3=7%

; ------------------------------------------------ 滚动 ---------------------
scroll       = 1               ; 1 = 跑马灯, 0 = 静止
width        = 620             ; 小条宽度
speed        = 60              ; 滚动速度(px/s). snap=1 时会取整到 fps 的整数倍, 60fps 下 60 就是 1 像素/帧(最匀)
gap          = 130             ; 每绕一圈之间的空隙
fps          = 60              ; 目标帧率
interval     = 100             ; 数值检查间隔(ms), 要小于最小的 rate

; ------------------------------------------------ 显示内容 -----------------
;  可以写成 line1 / line2 / ... 分段写, 程序会自动拼成一行显示.
;  @名字@ 取对应数值槽;  @@ 输出字面 @;  其它字符原样显示
line1 = 生命体征监测  //  SRC: @DEVICE@
line2 = //  HR @HR@   RR @RR@   SpO2 @SPO2@   T @T@   BP @SBP@/@DBP@
line3 = //  LIVER(肝功)  ALT @ALT@  AST @AST@  TBIL @TBIL@  ALB @ALB@
line4 = //  RENAL(肾功)  BUN @BUN@  CREA @CREA@  UA @UA@
line5 = //  THYROID(甲功)  TSH @TSH@  FT3 @FT3@  FT4 @FT4@
line6 = //  ABG(血气)  pH @PH@  PaO2 @PAO2@  PaCO2 @PACO2@  HCO3 @HCO3@
line7 = //  NEURO(神经递质)  DA @DA@  5-HT @HT5@  NE @NE@

; ------------------------------------------------ 数值槽 -------------------
;  格式: 可能范围 | 颜色 | 模式:步长:小数位 | 正常区间 | 报警色
;  可能范围 = 能飘到的最宽范围;  正常区间 = 超出就显示箭头并变报警色
slot.HR   = 45~155   | #39FF14 | walk:3      | 60~100    | #FF2E88
rate.HR   = 500
slot.RR   = 6~32     | #39FF14 | walk:0.6    | 12~20     | #FFB300
rate.RR   = 2000
slot.SPO2 = 85~100   | #00E5FF | walk:0.4    | 95~100    | #FF2E88
rate.SPO2 = 1500
slot.T    = 35.0~39.5| #FFB300 | walk:0.07:1 | 36.3~37.2 | #FF2E88
rate.T    = 20000
slot.SBP  = 85~175   | #00E5FF | walk:2.2    | 100~130   | #FFB300
slot.DBP  = 50~110   | #00E5FF | walk:1.8    | 60~85     | #FFB300
rate.SBP  = 5000
rate.DBP  = 5000

slot.ALT  = 5~180    | #39FF14 | walk:2.5    | 5~40      | #FFB300
slot.AST  = 8~160    | #39FF14 | walk:2.5    | 8~40      | #FFB300
slot.TBIL = 5~60     | #00E5FF | walk:1.2    | 5~21      | #FFB300
slot.ALB  = 28~52    | #00E5FF | walk:0.9    | 38~50     | #FFB300
rate.ALT  = 60000
rate.AST  = 60000
rate.TBIL = 60000
rate.ALB  = 60000

slot.BUN  = 2.0~14.0 | #00E5FF | walk:0.4:1  | 2.9~8.2   | #FFB300
slot.CREA = 40~200   | #00E5FF | walk:4.5    | 44~106    | #FFB300
slot.UA   = 120~560  | #00E5FF | walk:20     | 155~428   | #FFB300
rate.BUN  = 60000
rate.CREA = 60000
rate.UA   = 120000

slot.TSH  = 0.05~8.00| #39FF14 | walk:0.30:2 | 0.40~4.50 | #FFB300
slot.FT3  = 2.0~9.0  | #39FF14 | walk:0.27:1 | 3.1~6.8   | #FFB300
slot.FT4  = 8.0~30.0 | #39FF14 | walk:0.7:1  | 12.0~22.0 | #FFB300
rate.TSH  = 300000
rate.FT3  = 300000
rate.FT4  = 300000

slot.PH   = 7.20~7.55| #00E5FF | walk:0.007:2| 7.35~7.45 | #FF2E88
slot.PAO2 = 50~110   | #00E5FF | walk:1.4    | 80~100    | #FFB300
slot.PACO2= 25~60    | #00E5FF | walk:0.7    | 35~45     | #FFB300
slot.HCO3 = 16~32    | #00E5FF | walk:0.36:1 | 22~27     | #FFB300
rate.PH   = 3000
rate.PAO2 = 3000
rate.PACO2= 3000
rate.HCO3 = 5000

slot.DA   = 0.20~3.00| #FF2E88 | walk:0.11:2 | 0.50~2.00 | #FF2E88
slot.HT5  = 20~320   | #FF2E88 | walk:11     | 50~200    | #FF2E88
slot.NE   = 0.05~1.00| #FF2E88 | walk:0.036:2| 0.10~0.60 | #FF2E88
rate.DA   = 15000
rate.HT5  = 15000
rate.NE   = 15000

; 想加指标: line 里写 @XXX@, 再定义 slot.XXX 和 rate.XXX 即可 (箭头自动加)
